<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Wildcard</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
  :root { color-scheme: light; --ink: #4a3b58; }
  html, body { margin: 0; height: 100%; color: var(--ink); font-family: Nunito, "Trebuchet MS", "Segoe UI", sans-serif; font-weight: 800; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html { background: #bfe9ff; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: radial-gradient(circle at 18% 12%, rgba(255,255,255,.75) 0 6%, transparent 30%), radial-gradient(circle at 85% 90%, rgba(255,214,140,.55), transparent 45%), linear-gradient(160deg, #aee6ff 0%, #d7f4ea 55%, #fff1cf 100%); }
  #screen { width: min(100vw, calc((100vh - 40px) * 1.5)); max-width: 960px; aspect-ratio: 3 / 2; background: #fff8ec; border: 5px solid #fff; border-radius: 18px; box-sizing: border-box; box-shadow: 0 0 0 3px #ffb648, 0 10px 28px rgba(80,60,120,.28); }
  #help { font-size: 13px; text-align: center; padding: 6px 14px; color: #6a5478; background: rgba(255,255,255,.7); border-radius: 999px; box-shadow: 0 2px 8px rgba(80,60,120,.12); }
  #pad { display: none; width: min(100vw, 480px); justify-content: space-between; align-items: center; padding: 0 16px; box-sizing: border-box; }
  #pad .dp { display: grid; grid-template: repeat(3, 46px) / repeat(3, 46px); gap: 2px; filter: drop-shadow(0 4px 6px rgba(80,60,120,.22)); }
  #pad button { background: linear-gradient(#ffffff, #fff1d8); color: #7a5a3a; border: 3px solid #ffb648; border-radius: 14px; font: 900 15px Nunito, "Trebuchet MS", sans-serif; touch-action: none; box-shadow: inset 0 -3px 0 rgba(240,150,60,.25), inset 0 2px 0 #fff; transition: transform .06s ease, background .06s; }
  #pad button.on { transform: translateY(2px) scale(.94); background: linear-gradient(#ffe9b8, #ffd27a); box-shadow: inset 0 2px 4px rgba(200,110,30,.3); }
  #pad .dp button[data-k="up"] { border-radius: 14px 14px 6px 6px; } #pad .dp button[data-k="down"] { border-radius: 6px 6px 14px 14px; }
  #pad .dp button[data-k="left"] { border-radius: 14px 6px 6px 14px; } #pad .dp button[data-k="right"] { border-radius: 6px 14px 14px 6px; }
  #pad .ab { display: grid; grid-template-columns: repeat(2, 58px); gap: 8px; filter: drop-shadow(0 4px 6px rgba(80,60,120,.22)); }
  #pad .ab button { height: 58px; border-radius: 50%; font-size: 20px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.18); }
  #pad .ab button[data-k="a"] { background: radial-gradient(circle at 35% 30%, #9ff59a, #4cc95a 70%); border-color: #2f9a45; }
  #pad .ab button[data-k="b"] { background: radial-gradient(circle at 35% 30%, #ffb0a8, #ff6a5a 70%); border-color: #d0463c; }
  #pad .ab button[data-k="start"] { height: 30px; align-self: center; border-radius: 999px; font-size: 12px; background: linear-gradient(#8fe8ff, #3cc0e0); border-color: #2a8fb0; }
  #pad .ab button.on { filter: brightness(.92); }
  #pad .ab button[data-k="orb"] { height: 30px; align-self: center; border-radius: 999px; background: linear-gradient(#fffaf0, #f1e4c8); border-color: #8a5a2c; display: grid; place-items: center; }
  #pad .orb { display: block; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 50% 50%, #8af05a 0 22%, #3d5a26 23% 32%, transparent 33%), radial-gradient(circle at 35% 30%, #c9935a, #4a2c14 75%); background-size: contain; background-repeat: no-repeat; background-position: center; }
  /* Virtual thumbstick: drag anywhere inside the ring. */
  #pad .stick { position: relative; width: 132px; height: 132px; touch-action: none; pointer-events: auto; filter: drop-shadow(0 4px 6px rgba(80,60,120,.22)); }
  #pad .stick .ring { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.92), rgba(255,241,216,.85)); border: 3px solid #ffb648; box-shadow: inset 0 -4px 0 rgba(240,150,60,.18); }
  #pad .stick .ring::before { content: ''; position: absolute; inset: 22px; border-radius: 50%; border: 2px dashed rgba(240,160,70,.35); }
  #pad .stick .knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6dc, #ffbe5c 75%); border: 3px solid #f0962e; box-shadow: 0 4px 0 rgba(200,110,30,.35), inset 0 2px 0 #fff; transition: transform .08s ease-out; }
  #pad .stick.on .knob { transition: none; }
  /* Touch screens. Portrait: the game fills the width at the top, the controls get the bottom of the screen. */
  @media (pointer: coarse) {
    body { gap: 0; justify-content: flex-start; height: 100dvh; }
    #help { display: none; }
    #screen { width: 100vw; height: 60dvh; aspect-ratio: auto; max-width: none; border-width: 0; border-radius: 0; box-shadow: 0 6px 18px rgba(80,60,120,.25); }
    #pad { display: flex; flex: 1; width: 100vw; max-width: 560px; align-items: center; justify-content: space-between; padding: 12px max(22px, env(safe-area-inset-left)) max(18px, env(safe-area-inset-bottom)); }
    #pad .stick { width: min(40vw, 170px); height: min(40vw, 170px); }
    #pad .stick .knob { width: 38%; height: 38%; margin: -19% 0 0 -19%; }
    #pad .ab { grid-template-columns: repeat(2, min(18vw, 74px)); gap: min(3vw, 14px); }
    #pad .ab button { height: min(18vw, 74px); font-size: 22px; }
    #pad .ab button[data-k="start"], #pad .ab button[data-k="orb"] { height: 36px; }
  }
  /* Landscape: the game fills the whole screen edge to edge; the controls float over it, sized to the side margins
     left beside the centred 3:2 menu panel (margin = (100vw - 150dvh) / 2). */
  @media (pointer: coarse) and (orientation: landscape) {
    body { justify-content: center; --m: max(96px, calc((100vw - 150dvh) / 2 - 10px)); }
    #screen { width: 100vw; height: 100dvh; aspect-ratio: auto; box-shadow: none; }
    #pad { position: fixed; left: 0; right: 0; bottom: 0; flex: none; max-width: none; width: auto; pointer-events: none; padding: 0 max(8px, env(safe-area-inset-left)) max(10px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-right)); align-items: flex-end; }
    #pad .stick { width: min(var(--m), 40vh, 150px); height: min(var(--m), 40vh, 150px); }
    #pad .ab { grid-template-columns: repeat(2, min(calc(var(--m) / 2 - 4px), 17vh, 64px)); gap: 6px; }
    #pad .ab button { height: min(calc(var(--m) / 2 - 4px), 17vh, 64px); font-size: 18px; }
    #pad .ab button[data-k="start"], #pad .ab button[data-k="orb"] { height: 28px; font-size: 11px; }
    #pad button, #pad .stick { pointer-events: auto; opacity: .8; }
  }
</style>
</head>
<body>
<canvas id="screen" width="960" height="640" aria-label="Wildcard game screen"></canvas>
<div id="help">Arrows/WASD move &middot; Z/Space = A &middot; X/Esc = B (hold to run) &middot; C = throw orb &middot; Enter = Menu &middot; M = mute</div>
<div id="pad">
  <div class="stick" id="stick" aria-label="Move"><div class="ring"></div><div class="knob"></div></div>
  <div class="ab"><button data-k="start">MENU</button><button data-k="orb" aria-label="Throw orb"><i class="orb"></i></button><button data-k="b">B</button><button data-k="a">A</button></div>
</div>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Wildcard</title>
<style>
  :root { color-scheme: light; --ink: #4a3b58; }
  html, body { margin: 0; height: 100%; color: var(--ink); font-family: Nunito, "Trebuchet MS", "Segoe UI", sans-serif; font-weight: 800; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html { background: #bfe9ff; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: radial-gradient(circle at 18% 12%, rgba(255,255,255,.75) 0 6%, transparent 30%), radial-gradient(circle at 85% 90%, rgba(255,214,140,.55), transparent 45%), linear-gradient(160deg, #aee6ff 0%, #d7f4ea 55%, #fff1cf 100%); }
  #screen { width: min(100vw, calc((100vh - 40px) * 1.5)); max-width: 960px; aspect-ratio: 3 / 2; background: #fff8ec; border: 5px solid #fff; border-radius: 18px; box-sizing: border-box; box-shadow: 0 0 0 3px #ffb648, 0 10px 28px rgba(80,60,120,.28); }
  #help { font-size: 13px; text-align: center; padding: 6px 14px; color: #6a5478; background: rgba(255,255,255,.7); border-radius: 999px; box-shadow: 0 2px 8px rgba(80,60,120,.12); }
  #pad { display: none; width: min(100vw, 480px); justify-content: space-between; align-items: center; padding: 0 16px; box-sizing: border-box; }
  #pad .dp { display: grid; grid-template: repeat(3, 46px) / repeat(3, 46px); gap: 2px; filter: drop-shadow(0 4px 6px rgba(80,60,120,.22)); }
  #pad button { background: linear-gradient(#ffffff, #fff1d8); color: #7a5a3a; border: 3px solid #ffb648; border-radius: 14px; font: 900 15px Nunito, "Trebuchet MS", sans-serif; touch-action: none; box-shadow: inset 0 -3px 0 rgba(240,150,60,.25), inset 0 2px 0 #fff; transition: transform .06s ease, background .06s; }
  #pad button.on { transform: translateY(2px) scale(.94); background: linear-gradient(#ffe9b8, #ffd27a); box-shadow: inset 0 2px 4px rgba(200,110,30,.3); }
  #pad .dp button[data-k="up"] { border-radius: 14px 14px 6px 6px; } #pad .dp button[data-k="down"] { border-radius: 6px 6px 14px 14px; }
  #pad .dp button[data-k="left"] { border-radius: 14px 6px 6px 14px; } #pad .dp button[data-k="right"] { border-radius: 6px 14px 14px 6px; }
  #pad .ab { display: grid; grid-template-columns: repeat(2, 58px); gap: 8px; filter: drop-shadow(0 4px 6px rgba(80,60,120,.22)); }
  #pad .ab button { height: 58px; border-radius: 50%; font-size: 20px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.18); }
  #pad .ab button[data-k="a"] { background: radial-gradient(circle at 35% 30%, #9ff59a, #4cc95a 70%); border-color: #2f9a45; }
  #pad .ab button[data-k="b"] { background: radial-gradient(circle at 35% 30%, #ffb0a8, #ff6a5a 70%); border-color: #d0463c; }
  #pad .ab button[data-k="start"] { height: 30px; align-self: center; border-radius: 999px; font-size: 12px; background: linear-gradient(#8fe8ff, #3cc0e0); border-color: #2a8fb0; }
  #pad .ab button.on { filter: brightness(.92); }
  @media (pointer: coarse) { #pad { display: flex; } #help { display: none; } body { gap: 12px; justify-content: flex-start; } #screen { width: 100vw; border-width: 0; border-radius: 0; box-shadow: 0 6px 18px rgba(80,60,120,.25); } }
  /* Phones held sideways: the screen fills the height and the pad floats over the empty margins. */
  @media (pointer: coarse) and (orientation: landscape) {
    body { justify-content: center; gap: 0; }
    #screen { width: auto; height: 100vh; max-width: 100vw; }
    #pad { position: fixed; left: 0; right: 0; bottom: 8px; width: auto; pointer-events: none; padding: 0 max(14px, env(safe-area-inset-left)) 0 max(14px, env(safe-area-inset-right)); }
    #pad button { pointer-events: auto; opacity: .72; }
  }
</style>
</head>
<body>
<canvas id="screen" width="960" height="640" aria-label="Wildcard game screen"></canvas>
<div id="help">Arrows/WASD move &middot; Z/Space = A &middot; X/Esc = B (hold to run) &middot; Enter = Menu &middot; M = mute</div>
<div id="pad">
  <div class="dp">
    <span></span><button data-k="up">&#9650;</button><span></span>
    <button data-k="left">&#9664;</button><span></span><button data-k="right">&#9654;</button>
    <span></span><button data-k="down">&#9660;</button><span></span>
  </div>
  <div class="ab"><button data-k="start">MENU</button><button data-k="b">B</button><span></span><button data-k="a">A</button></div>
</div>
<script src="js/fonts.js"></script>
<script src="js/data.js"></script>
<script src="js/creature.js"></script>
<script src="js/gfx.js"></script>
<script src="js/terrain.js"></script>
<script src="js/sprites.js"></script>
<script src="js/uikit.js"></script>
<script src="js/engine.js"></script>
<script src="js/screens.js"></script>
<script src="js/battle.js"></script>
<script src="js/mapkit.js"></script>
<script src="js/maps/hub.js"></script>
<script src="js/maps/sunmeadow.js"></script>
<script src="js/maps/mirewood.js"></script>
<script src="js/maps/ridge.js"></script>
<script src="js/maps/shore.js"></script>
<script src="js/world.js"></script>
<script src="js/build.js"></script>
<script src="js/main.js"></script>
</body>
</html>

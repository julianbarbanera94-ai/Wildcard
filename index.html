<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Wildcard</title>
<link rel="preload" href="fonts/nunito-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: 'Nunito'; font-weight: 700; src: url(fonts/nunito-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 800; src: url(fonts/nunito-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 900; src: url(fonts/nunito-latin-900-normal.woff2) format('woff2'); }
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #101018; color: #cfd2e0; font-family: "Courier New", monospace; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  #screen { width: min(100vw, calc((100vh - 40px) * 1.5)); max-width: 960px; aspect-ratio: 3 / 2; background: #000; border: 4px solid #2a2c3c; border-radius: 6px; box-sizing: border-box; }
  #help { font-size: 12px; opacity: .75; text-align: center; padding: 0 12px; }
  #pad { display: none; width: min(100vw, 480px); justify-content: space-between; align-items: center; padding: 0 16px; box-sizing: border-box; }
  #pad .dp { display: grid; grid-template: repeat(3, 44px) / repeat(3, 44px); }
  #pad button { background: #2a2c3c; color: #e8e8f0; border: 2px solid #44486a; border-radius: 10px; font: bold 14px "Courier New", monospace; touch-action: none; }
  #pad button.on { background: #5a62a8; }
  #pad .ab { display: grid; grid-template-columns: repeat(2, 56px); gap: 8px; }
  #pad .ab button { height: 56px; border-radius: 50%; }
  @media (pointer: coarse) { #pad { display: flex; } #help { display: none; } body { gap: 12px; justify-content: flex-start; } #screen { width: 100vw; border-width: 0; border-radius: 0; } }
  /* Phones held sideways: the screen fills the height and the pad floats over the empty margins. */
  @media (pointer: coarse) and (orientation: landscape) {
    body { justify-content: center; gap: 0; }
    #screen { width: auto; height: 100vh; max-width: 100vw; }
    #pad { position: fixed; left: 0; right: 0; bottom: 8px; width: auto; pointer-events: none; padding: 0 max(14px, env(safe-area-inset-left)) 0 max(14px, env(safe-area-inset-right)); }
    #pad button { pointer-events: auto; opacity: .6; }
  }
</style>
</head>
<body>
<canvas id="screen" width="960" height="640" aria-label="Wildcard game screen"></canvas>
<div id="help">Arrows/WASD move &middot; Z/Space = A &middot; X/Esc = B (hold to run) &middot; Enter = Menu &middot; M = mute</div>
<div id="pad">
  <div class="dp">
    <span></span><button data-k="up">&#9650;</button><span></span>
    <button data-k="left">&#9664;</button><span></span><button data-k="right">&#9654;</button>
    <span></span><button data-k="down">&#9660;</button><span></span>
  </div>
  <div class="ab"><button data-k="start">MENU</button><button data-k="b">B</button><span></span><button data-k="a">A</button></div>
</div>
<script src="js/data.js"></script>
<script src="js/creature.js"></script>
<script src="js/gfx.js"></script>
<script src="js/terrain.js"></script>
<script src="js/sprites.js"></script>
<script src="js/uikit.js"></script>
<script src="js/engine.js"></script>
<script src="js/screens.js"></script>
<script src="js/battle.js"></script>
<script src="js/mapkit.js"></script>
<script src="js/maps/hub.js"></script>
<script src="js/maps/sunmeadow.js"></script>
<script src="js/maps/mirewood.js"></script>
<script src="js/maps/ridge.js"></script>
<script src="js/maps/shore.js"></script>
<script src="js/world.js"></script>
<script src="js/build.js"></script>
<script src="js/main.js"></script>
</body>
</html>
